<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>쇼핑몰 - 메인</title>
	<link rel="stylesheet" href="/css/home.css">
	<!-- 💡 토스 결제위젯(PaymentWidget) SDK -->
	<script src="https://js.tosspayments.com/v1/payment-widget"></script>
</head>
<body>

<!-- 상단 내비게이션 -->
<nav class="navbar">
	<a href="/home.html" class="logo">Shop</a>
	<a href="/mypage.html" class="mypage-link">👤 마이페이지</a>
</nav>

<div class="container">
	<h2 class="section-title">🔥 인기 상품 목록</h2>
	
	<!-- 상품 카드 목록 -->
	<div id="productGrid" class="product-grid">
		<div class="empty-state">상품 목록을 불러오는 중입니다...</div>
	</div>
</div>

<!-- 💳 [결제위젯 모달 팝업] -->
<div id="checkoutModal" class="modal-overlay">
	<div class="modal-content">
		<div class="product-info">
			<div id="modalProductName" class="product-name">상품명</div>
			<div id="modalProductPrice" class="product-price">0원</div>
		</div>
		
		<!-- 토스 결제위젯 렌더링 영역 -->
		<div id="payment-method"></div>
		<div id="agreement"></div>
		
		<!-- 결제 버튼 및 닫기 -->
		<button id="payment-button" class="btn-buy">결제하기</button>
		<button class="close-btn" onclick="closeModal()">닫기</button>
	</div>
</div>

<script>
    // 💡 본인의 토스 클라이언트 키로 교체하세요!
    const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
    const customerKey = "USER_" + Math.random().toString(36).substring(2, 9); // 임의의 사용자 식별키

    let paymentWidget = null;
    let paymentMethodsWidget = null;
    let selectedProductId = null;
    let selectedAmount = 0;

    document.addEventListener("DOMContentLoaded", () => {
        // 1. 토스 결제위젯 객체 초기화 (1회만 생성)
        paymentWidget = PaymentWidget(clientKey, customerKey);

        // 2. 백엔드에서 상품 목록 불러오기
        loadProducts();
    });

    // 💡 상품 목록 조회 API
    async function loadProducts() {
        const grid = document.getElementById("productGrid");

        try {
            const response = await fetch("/api/products");
            if (!response.ok) throw new Error("상품 목록 불러오기 실패");

            const products = await response.json();

            if (products.length === 0) {
                grid.innerHTML = `<div class="empty-state">등록된 상품이 없습니다.</div>`;
                return;
            }

            grid.innerHTML = products.map(product => renderProductCard(product)).join('');

        } catch (error) {
            console.error("❌ 에러 발생:", error);
            grid.innerHTML = `<div class="empty-state">상품 정보를 불러오지 못했습니다.</div>`;
        }
    }

    // 💡 상품 카드 HTML 생성
    function renderProductCard(product) {
        const imgUrl = product.imageUrl ? product.imageUrl : 'https://placehold.co/400x400?text=No+Image';
        const formattedPrice = Number(product.price).toLocaleString();

        return `
            <div class="product-card">
                <div class="product-img-wrapper">
                    <img src="${imgUrl}" alt="${escapeHtml(product.name)}" class="product-img"
                         onerror="this.src='https://placehold.co/400x400?text=No+Image'">
                </div>
                <div class="product-info">
                    <div>
                        <div class="product-name">${escapeHtml(product.name)}</div>
                        <div class="product-meta">
                            <span class="product-price">${formattedPrice}원</span>
                            <span class="product-stock">재고 ${product.stockQuantity}개</span>
                        </div>
                    </div>
                    <button class="btn-buy" onclick="openPaymentModal(${product.id}, '${escapeJsStr(product.name)}', ${product.price})">
                        구매하기
                    </button>
                </div>
            </div>
        `;
    }

    // 💡 1. [구매하기] 클릭 시 결제위젯 모달 띄우기
    function openPaymentModal(productId, productName, amount) {
        selectedProductId = productId;
        selectedAmount = amount;

        document.getElementById("modalProductName").innerText = productName;
        document.getElementById("modalProductPrice").innerText = Number(amount).toLocaleString() + "원";

        // 모달창 보여주기
        const modal = document.getElementById("checkoutModal");
        modal.style.display = "flex";

        // 영역 초기화 후 결제위젯 UI 렌더링
        document.getElementById("payment-method").innerHTML = "";
        document.getElementById("agreement").innerHTML = "";

        // 결제 수단 영역 렌더링
        paymentMethodsWidget = paymentWidget.renderPaymentMethods(
            "#payment-method",
            { value: amount },
            { variantKey: "DEFAULT" }
        );

        // 이용약관 영역 렌더링
        paymentWidget.renderAgreement(
            "#agreement",
            { variantKey: "AGREEMENT" }
        );

        // 결제 버튼 이벤트 연결
        const paymentButton = document.getElementById("payment-button");
        paymentButton.onclick = () => requestWidgetPayment(productName);
    }

    // 💡 2. 모달 안의 [결제하기] 버튼 클릭 시 토스 결제 요청
    function requestWidgetPayment(productName) {
        const orderId = "ORDER_" + Date.now() + "_" + Math.floor(Math.random() * 1000);

        paymentWidget.requestPayment({
            orderId: orderId,
            orderName: productName,
            successUrl: window.location.origin + `/widget/success.html?productId=${selectedProductId}`,
            failUrl: window.location.origin + "/fail.html",
            customerEmail: "customer@example.com",
            customerName: "HongGilDong"
        }).catch(error => {
            if (error.code === 'USER_CANCEL') {
                console.log('사용자가 결제창을 닫았습니다.');
            } else {
                alert(`결제 오류: ${error.message}`);
            }
        });
    }

    // 💡 모달 닫기
    function closeModal() {
        document.getElementById("checkoutModal").style.display = "none";
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeJsStr(str) {
        if (!str) return '';
        return str.replace(/'/g, "\\'");
    }
</script>
</body>
</html>
