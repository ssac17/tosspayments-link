<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>마이페이지 - 내 결제 내역</title>
	<link rel="stylesheet" href="css/mypage.css" type="text/css" />
</head>
<body>

<div class="container">
	<!-- 헤더 영역 -->
	<header class="page-header">
		<a href="/home.html" class="back-btn">← 메인으로</a>
		<h1>👤 마이페이지</h1>
		<p class="subtitle">구매 및 결제 내역을 확인할 수 있습니다.</p>
	</header>
	
	<!-- 결제 내역 리스트 영역 -->
	<main class="payment-section">
		<div class="section-title">
			<span>결제 내역</span>
			<span id="paymentCount" class="badge">0건</span>
		</div>
		
		<div id="paymentList" class="payment-list">
			<!-- 자바스크립트로 동적 생성됨 -->
			<div class="empty-state">결제 내역을 불러오는 중...</div>
		</div>
	</main>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadPayments();
    });

    async function loadPayments() {
        const listContainer = document.getElementById("paymentList");
        const countBadge = document.getElementById("paymentCount");

        try {
            const response = await fetch("/api/payments");
            if (!response.ok) throw new Error("결제 내역 조회 실패");

            const payments = await response.json();
            countBadge.textContent = `${payments.length}건`;

            if (payments.length === 0) {
                listContainer.innerHTML = `<div class="empty-state">아직 결제 내역이 없습니다.</div>`;
                return;
            }

            listContainer.innerHTML = payments.map(payment => renderPaymentCard(payment)).join('');

        } catch (error) {
            console.error("❌ 에러 발생:", error);
            listContainer.innerHTML = `<div class="empty-state error">결제 내역을 불러오는 중 오류가 발생했습니다.</div>`;
        }
    }

    function renderPaymentCard(payment) {
        // 날짜 포맷팅 (YYYY-MM-DD HH:mm)
        const dateStr = payment.approvedAt
            ? new Date(payment.approvedAt).toLocaleString("ko-KR", { dateStyle: "short", timeStyle: "short" })
            : "시간 정보 없음";

        // 상태값 한글 변환
        const isDone = payment.status === 'DONE';
        const statusText = isDone ? '결제 완료' : payment.status;
        const statusClass = isDone ? 'status-done' : 'status-cancel';

        return `
            <div class="payment-card">
                <div class="card-header">
                    <span class="order-date">${dateStr}</span>
                    <span class="status-tag ${statusClass}">${statusText}</span>
                </div>
                
                <div class="card-body">
                    <div class="item-info">
                        <div class="order-name">${payment.orderName || '상품 정보 없음'}</div>
                        <div class="order-id">주문번호: ${payment.orderId}</div>
                    </div>
                    <div class="amount-info">
                        <span class="amount">${Number(payment.totalAmount).toLocaleString()}</span>원
                    </div>
                </div>

                <div class="card-footer">
                    <div class="pay-method">
                        <span>결제 수단: <strong>${payment.method || '미지정'}</strong></span>
                        ${payment.cardInfo ? `<span class="card-detail">(${payment.cardInfo})</span>` : ''}
                    </div>
                    
                    <div class="btn-group">
                        ${payment.receiptUrl ? `
                            <a href="${payment.receiptUrl}" target="_blank" class="btn btn-receipt">
                                🧾 영수증
                            </a>
                        ` : ''}
                    </div>
                </div>
            </div>
        `;
    }
</script>
</body>
</html>
