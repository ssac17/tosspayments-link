<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>마이페이지 - 내 결제 내역</title>
	<link rel="stylesheet" href="/css/mypage.css" type="text/css" />
</head>
<body>

<div class="container">
	<!-- 헤더 영역 -->
	<header class="page-header">
		<a href="/home.html" class="back-btn">← 메인으로</a>
		<h1>👤 마이페이지</h1>
		<p class="subtitle">구매 및 결제 내역을 확인할 수 있습니다.</p>
	</header>
	
	<!-- 결제 내역 리스트 영역 -->
	<main class="payment-section">
		<div class="section-title">
			<span>결제 내역</span>
			<span id="paymentCount" class="badge">0건</span>
		</div>
		
		<div id="paymentList" class="payment-list">
			<!-- 자바스크립트로 동적 생성됨 -->
			<div class="empty-state">결제 내역을 불러오는 중...</div>
		</div>
		
		<!-- 💡 추가: 페이지네이션 버튼 영역 -->
		<div id="pagination" class="pagination"></div>
	</main>
</div>

<!-- 💡 결제 취소 모달 영역 -->
<div id="cancelModal" class="modal-overlay hidden">
	<div class="modal-content">
		<div class="modal-header">
			<h3>결제 취소 요청</h3>
			<button class="close-btn" onclick="closeCancelModal()">✕</button>
		</div>
		<div class="modal-body">
			<p class="modal-subtitle">취소 사유를 선택해 주세요.</p>
			
			<div class="radio-group">
				<label class="radio-item">
					<input type="radio" name="cancelReason" value="단순 변심" checked>
					<span>단순 변심</span>
				</label>
				<label class="radio-item">
					<input type="radio" name="cancelReason" value="사이즈 안맞음">
					<span>사이즈 안맞음</span>
				</label>
				<label class="radio-item">
					<input type="radio" name="cancelReason" value="상품 불량">
					<span>상품 불량</span>
				</label>
			</div>
		</div>
		<div class="modal-footer">
			<button class="btn btn-secondary" onclick="closeCancelModal()">취소</button>
			<button class="btn btn-danger" onclick="submitCancel()">결제 취소 실행</button>
		</div>
	</div>
</div>

<script>
    // 💡 현재 페이지 상태 관리 (0부터 시작)
    let currentPage = 0;
    const pageSize = 5; // 한 페이지에 보여줄 개수

    document.addEventListener("DOMContentLoaded", () => {
        loadPayments(currentPage);
    });

    async function loadPayments(page) {
        currentPage = page;
        const listContainer = document.getElementById("paymentList");
        const countBadge = document.getElementById("paymentCount");
        const paginationContainer = document.getElementById("pagination");

        try {
            const response = await fetch(`/api/payments?page=${page}&size=${pageSize}`);
            if (!response.ok) throw new Error(`HTTP 에러! 상태: ${response.status}`);

            const data = await response.json();

            // 💡 PagedModel 규격 대응
            const payments = data.content || (data._embedded ? data._embedded.paymentResponseDtoList : []);
            const pageInfo = data.page || {}; // 페이지 정보 객체 ({ size, totalElements, totalPages, number })

            // 전체 건수 표시
            countBadge.textContent = `${pageInfo.totalElements || 0}건`;

            if (!payments || payments.length === 0) {
                listContainer.innerHTML = `<div class="empty-state">아직 결제 내역이 없습니다.</div>`;
                paginationContainer.innerHTML = '';
                return;
            }

            // 1. 카드 리스트 렌더링
            listContainer.innerHTML = payments.map(payment => renderPaymentCard(payment)).join('');

            // 2. 💡 page 객체 내부에서 totalPages, number를 꺼내어 전달
            renderPagination(pageInfo.totalPages || 0, pageInfo.number || 0);

        } catch (error) {
            console.error("❌ 에러 발생:", error);
            listContainer.innerHTML = `<div class="empty-state error">결제 내역을 불러오는 중 오류가 발생했습니다.</div>`;
            paginationContainer.innerHTML = '';
        }
    }

    function renderPaymentCard(payment) {
        const dateStr = payment.approvedAt
            ? new Date(payment.approvedAt).toLocaleString("ko-KR", {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit'
            })
            : "시간 정보 없음";

        const statusMap = {
            'DONE': { text: '결제 완료', className: 'status-done' },
            'CANCELED': { text: '결제 취소', className: 'status-cancel' },
            'ABORTED': { text: '결제 실패', className: 'status-cancel' },
            'READY': { text: '결제 대기', className: 'status-ready' }
        };

        const currentStatus = statusMap[payment.status] || { text: payment.status || '상태 없음', className: '' };
        const orderName = escapeHtml(payment.orderName || '상품 정보 없음');
        const orderId = escapeHtml(payment.orderId || '-');
        const method = escapeHtml(payment.method || '미지정');
        const cardInfo = payment.cardInfo ? `(${escapeHtml(payment.cardInfo)})` : '';
        const paymentKey = payment.paymentKey || '';

        return `
            <div class="payment-card">
                <div class="card-header">
                    <span class="order-date">${dateStr}</span>
                    <span class="status-tag ${currentStatus.className}">${currentStatus.text}</span>
                </div>
                
                <div class="card-body">
                    <div class="item-info">
                        <div class="order-name">${orderName}</div>
                        <div class="order-id">주문번호: ${orderId}</div>
                    </div>
                    <div class="amount-info">
                        <span class="amount">${Number(payment.totalAmount || 0).toLocaleString()}</span>원
                    </div>
                </div>

                <div class="card-footer">
                    <div class="pay-method">
                        <span>결제 수단: <strong>${method}</strong></span>
                        ${cardInfo ? `<span class="card-detail">${cardInfo}</span>` : ''}
                    </div>
                    
                    <div class="btn-group">
                        ${payment.receiptUrl ? `
                            <a href="${payment.receiptUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-receipt">
                                🧾 영수증
                            </a>
                        ` : ''}
                        
                        <!-- 💡 DONE 상태일 때만 결제 취소 버튼 노출 -->
                        ${payment.status === 'DONE' ? `
                            <button class="btn btn-cancel" onclick="openCancelModal('${paymentKey}')">
                                결제 취소
                            </button>
                        ` : ''}
                    </div>
                </div>
            </div>
        `;
    }

    // 💡 3. 하단 페이지네이션 UI 동적 생성 함수
    function renderPagination(totalPages, pageNumber) {
        const container = document.getElementById("pagination");
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        let html = '';

        // [이전] 버튼
        const prevDisabled = pageNumber === 0 ? 'disabled' : '';
        html += `<button class="page-btn" ${prevDisabled} onclick="loadPayments(${pageNumber - 1})">이전</button>`;

        // [숫자] 버튼들
        for (let i = 0; i < totalPages; i++) {
            const activeClass = i === pageNumber ? 'active' : '';
            html += `<button class="page-btn ${activeClass}" onclick="loadPayments(${i})">${i + 1}</button>`;
        }

        // [다음] 버튼
        const nextDisabled = pageNumber === totalPages - 1 ? 'disabled' : '';
        html += `<button class="page-btn" ${nextDisabled} onclick="loadPayments(${pageNumber + 1})">다음</button>`;

        container.innerHTML = html;
    }

    // 선택된 결제 키를 저장할 변수
    let selectedPaymentKey = null;

    // [결제 취소] 버튼 클릭 시 모달 열기
    function openCancelModal(paymentKey) {
        if (!paymentKey) {
            alert("결제 키 정보가 없습니다.");
            return;
        }
        selectedPaymentKey = paymentKey;
        document.getElementById("cancelModal").classList.remove("hidden");
    }

    // 모달 닫기
    function closeCancelModal() {
        selectedPaymentKey = null;
        document.getElementById("cancelModal").classList.add("hidden");
    }

    // 모달 안의 [결제 취소 실행] 버튼 클릭 시 실행
    async function submitCancel() {
        if (!selectedPaymentKey) return;

        // 선택된 라디오 버튼의 값 가져오기
        const selectedRadio = document.querySelector('input[name="cancelReason"]:checked');
        const cancelReason = selectedRadio ? selectedRadio.value : "단순 변심";

        try {
            const response = await fetch('/api/payments/cencel', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    paymentKey: selectedPaymentKey,
                    cancelReason: cancelReason
                })
            });

            if (response.ok) {
                alert("결제가 성공적으로 취소되었습니다.");
                closeCancelModal();
                loadPayments(currentPage); // 목록 새로고침
            } else {
                const errorData = await response.json().catch(() => ({}));
                alert(`취소 실패: ${errorData.message || '결제 취소 처리 중 오류가 발생했습니다.'}`);
            }
        } catch (error) {
            console.error("❌ 결제 취소 에러:", error);
            alert("서버 통신 중 오류가 발생했습니다.");
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
