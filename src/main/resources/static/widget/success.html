<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>결제 성공 - 토스페이먼츠</title>
	<link rel="stylesheet" href="/css/success.css" />
</head>
<body>

<div class="card-container">
	<div class="icon-circle">✓</div>
	<h2 class="title">결제가 완료되었습니다</h2>
	<p class="subtitle">주문이 성공적으로 접수되었습니다.</p>
	
	<div class="info-box">
		<div class="info-row">
			<span class="info-label">주문번호</span>
			<span id="orderId" class="info-value">-</span>
		</div>
		<div class="info-row">
			<span class="info-label">PaymentKey</span>
			<span id="paymentKey" class="info-value" style="font-size: 11px; color: #b0b8c1;">-</span>
		</div>
		<div class="info-row">
			<span class="info-label">결제 금액</span>
			<span id="amount" class="info-value amount">0원</span>
		</div>
	</div>
	
	<div class="redirect-msg">
		<strong id="countdown">3</strong>초 후 메인 화면으로 돌아갑니다.
	</div>
	
	<a href="/home.html" class="home-btn">메인으로 이동하기</a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const paymentKey = urlParams.get("paymentKey");
    const orderId = urlParams.get("orderId");
    const amount = urlParams.get("amount");

    // 화면 데이터 미리 세팅
    document.getElementById("orderId").textContent = orderId || '-';
    document.getElementById("paymentKey").textContent = paymentKey || '-';
    document.getElementById("amount").textContent = amount ? Number(amount).toLocaleString() + "원" : '0원';

    async function confirm() {
        const requestData = {
            paymentKey: paymentKey,
            orderId: orderId,
            amount: amount,
        };

        try {
            const response = await fetch("/confirm", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(requestData),
            });

            const json = await response.json();

            if (!response.ok) {
                console.error("결제 승인 실패:", json);
                window.location.href = `/fail.html?message=${encodeURIComponent(json.message || '결제 승인 실패')}&code=${json.code || 'UNKNOWN'}`;
                return;
            }

            console.log("결제 승인 성공:", json);

            // 승인 성공 시 3초 카운트다운 시작!
            startCountdown();

        } catch (error) {
            console.error("통신 에러:", error);
            window.location.href = `/fail.html?message=${encodeURIComponent("서버 통신 중 오류가 발생했습니다.")}`;
        }
    }

    
    function startCountdown() {
        let seconds = 3;
        const countdownEl = document.getElementById("countdown");

        const timer = setInterval(() => {
            seconds--;
            if (countdownEl) countdownEl.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "/home.html";
            }
        }, 1000);
    }

    // 실행
    confirm();
</script>

</body>
</html>
