<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>결제 관리자 실시간 대시보드</title>
	<!-- CSS 라이브러리 (Tailwind CSS) -->
	<script src="https://cdn.tailwindcss.com"></script>
	<!-- SockJS & STOMP 라이브러리 (웹소켓 통신용) -->
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
	<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="bg-gray-100 p-8">

<div class="max-w-6xl mx-auto">
	<!-- 헤더 -->
	<div class="flex justify-between items-center mb-8">
		<h1 class="text-3xl font-bold text-gray-800">💳 결제/취소 실시간 모니터링</h1>
		<div id="connection-status" class="flex items-center space-x-2 text-sm font-semibold text-red-500">
			<span class="w-3 h-3 bg-red-500 rounded-full inline-block animate-ping"></span>
			<span>연결 대기 중...</span>
		</div>
	</div>
	
	<!-- 카드 대시보드 (실시간 숫자 변경) -->
	<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
		<!-- 총 결제 금액 -->
		<div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
			<p class="text-sm font-medium text-gray-500">총 결제 금액</p>
			<p id="total-amount" class="text-3xl font-extrabold text-blue-600 mt-2">0 원</p>
		</div>
		<!-- 실시간 결제 건수 -->
		<div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
			<p class="text-sm font-medium text-gray-500">오늘 결제 건수</p>
			<p id="payment-count" class="text-3xl font-extrabold text-green-600 mt-2">0 건</p>
		</div>
		<!-- 실시간 취소 건수 -->
		<div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
			<p class="text-sm font-medium text-gray-500">오늘 취소 건수</p>
			<p id="cancel-count" class="text-3xl font-extrabold text-red-500 mt-2">0 건</p>
		</div>
	</div>
	
	<!-- 실시간 로그 테이블 -->
	<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
		<div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
			<h2 class="text-lg font-bold text-gray-700">실시간 결제/취소 타임라인</h2>
		</div>
		<div class="overflow-x-auto">
			<table class="w-full text-left border-collapse">
				<thead>
				<tr class="border-b bg-gray-100 text-gray-600 text-sm">
					<th class="py-3 px-6">유형</th>
					<th class="py-3 px-6">상세 내용 / 사유</th>
					<th class="py-3 px-6">금액</th>
					<th class="py-3 px-6">시각</th>
				</tr>
				</thead>
				<tbody id="event-log-list" class="divide-y divide-gray-200 text-sm">
				<tr id="empty-row">
					<td colspan="4" class="py-8 text-center text-gray-400">
						아직 발생한 결제 이력이 없습니다. 서버를 연동해 보세요!
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>

<!-- 스크립트: 웹소켓 연결 및 DOM 조작 -->
<script>
    let totalAmount = 0;
    let paymentCount = 0;
    let cancelCount = 0;

    // 1. 웹소켓 연결 (서버의 /ws-stomp 엔드포인트)
    const socket = new SockJS('/ws-stomp');
    const stompClient = Stomp.over(socket);

    // 콘솔 로그 너무 빽빽하게 찍히는 거 방지 (디버그 모드 끄기)
    stompClient.debug = null;

    stompClient.connect({}, function (frame) {
        // 연결 성공 시 상태 표시 변경
        const statusDiv = document.getElementById('connection-status');
        statusDiv.className = "flex items-center space-x-2 text-sm font-semibold text-green-500";
        statusDiv.innerHTML = `
                <span class="w-3 h-3 bg-green-500 rounded-full inline-block"></span>
                <span>실시간 연결됨 (STOMP)</span>
            `;

        // 2. "/topic/admin/payment" 채널 구독 시작!
        stompClient.subscribe('/topic/admin/payment', function (response) {
            const data = JSON.parse(response.body);
            handleRealtimeEvent(data);
        });
    }, function (error) {
        const statusDiv = document.getElementById('connection-status');
        statusDiv.className = "flex items-center space-x-2 text-sm font-semibold text-red-500";
        statusDiv.innerHTML = `<span>연결 실패 (서버를 확인하세요)</span>`;
    });

    // 3. 서버에서 메시지가 왔을 때 화면 업데이트 함수
    function handleRealtimeEvent(data) {
        // '데이터 없음' 안내 행 삭제
        const emptyRow = document.getElementById('empty-row');
        if (emptyRow) emptyRow.remove();

        const logList = document.getElementById('event-log-list');
        const newRow = document.createElement('tr');
        newRow.className = "hover:bg-gray-50 transition-colors animate-pulse"; // 깜빡임 효과

        const now = new Date().toLocaleTimeString();

        if (data.type === 'PAYMENT_SUCCESS') {
            // 수치 증가
            totalAmount += (data.amount || 0);
            paymentCount += 1;

            newRow.innerHTML = `
                    <td class="py-3 px-6 font-bold text-green-600">결제 성공</td>
                    <td class="py-3 px-6">${data.orderName || '결제 건'}</td>
                    <td class="py-3 px-6 font-semibold">+${(data.amount || 0).toLocaleString()}원</td>
                    <td class="py-3 px-6 text-gray-400">${now}</td>
                `;
        } else if (data.type === 'PAYMENT_CANCELED') {
            // 수치 반영
            totalAmount -= (data.amount || 0);
            cancelCount += 1;

            newRow.innerHTML = `
                    <td class="py-3 px-6 font-bold text-red-500">결제 취소</td>
                    <td class="py-3 px-6 text-gray-500">사유: ${data.reason || '단순 변심'}</td>
                    <td class="py-3 px-6 font-semibold text-red-500">-${(data.amount || 0).toLocaleString()}원</td>
                    <td class="py-3 px-6 text-gray-400">${now}</td>
                `;
        }

        // 최신 로그가 맨 위에 올라오도록 상단 삽입
        logList.insertBefore(newRow, logList.firstChild);

        // 대시보드 카운터 숫징 갱신
        document.getElementById('total-amount').innerText = `${totalAmount.toLocaleString()} 원`;
        document.getElementById('payment-count').innerText = `${paymentCount} 건`;
        document.getElementById('cancel-count').innerText = `${cancelCount} 건`;
    }
</script>
</body>
</html>
